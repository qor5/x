http:
  address: ":8787"
  pathPrefix: ""
  readTimeout: "10s"
  readHeaderTimeout: "4s"
  writeTimeout: "20s"
  idleTimeout: "120s"
  # 0 = unlimited. Without it a single oversized body is read wholly into memory.
  # Left at 0 by default on purpose: a sane cap depends entirely on the service
  # (an upload endpoint may legitimately need hundreds of MiB), so the library
  # cannot pick one for you. Set it per service, and prefer capping at the
  # gateway too (Envoy requestBuffer / nginx proxy-body-size).
  maxRequestBodySize: 0
  # 0 = unlimited. Counts TCP CONNECTIONS, not requests: under HTTP/1.1 the two
  # roughly coincide, under HTTP/2 one connection multiplexes many requests and
  # they fully decouple. Guards fd exhaustion only.
  maxConnections: 0
  # 0 = Go's default (250). PER CONNECTION, not global.
  # Multiply by maxConnections for the in-flight ceiling. On its own it bounds
  # nothing — a client just opens more connections. Behind a gateway that already
  # caps concurrency (Envoy's maxParallelRequests), lowering it buys no extra
  # protection and costs multiplexing; leave it at 0 unless you need the ceiling
  # to be arithmetically knowable.
  maxConcurrentStreams: 0
  tls:
    enabled: false
    certBase64: ""
    keyBase64: ""
  cors:
    debug: false
    allowedOrigins: []
    allowedMethods: []
    exposedHeaders: []
    maxAge: 600s
    denySimpleRequests: true
  denyMIMETypeSniffing: true
  denyClickjacking: true
  enableHSTS: true
